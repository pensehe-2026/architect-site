<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>法規公告分類 | 何中揚建築師事務所</title>
    <link rel="stylesheet" href="styles.css?v=20260602-nlma-regulations" />
  </head>
  <body class="detail-page regulation-category-page">
    <header class="site-header detail-header" aria-label="網站導覽">
      <a class="brand" href="index.html#top" aria-label="回到首頁">
        <span class="brand-mark">H</span>
        <span class="brand-copy">
          <strong>何中揚建築師事務所</strong>
          <span>HO CHUNG YANG Architecture firm + Yu-Yi Interior Design</span>
        </span>
      </a>
      <nav class="main-nav" aria-label="主要選單">
        <a href="about.html">關於我們</a>
        <a href="projects.html">作品集</a>
        <a href="index.html#regulations">法規</a>
        <a href="index.html#services">服務</a>
        <a href="index.html#contact">聯絡</a>
      </nav>
    </header>

    <main class="detail-main">
      <a class="back-link" href="nlma-regulations.html">回法規公告大項目</a>
      <section class="detail-shell">
        <p class="eyebrow">NLMA Category</p>
        <h1 id="categoryTitle">法規公告分類</h1>
        <p id="categoryLead">紅字標題已排序至清單最上方，其餘項目依日期由新到舊排列。</p>
        <div class="detail-highlights" id="categorySummary"></div>
      </section>

      <section class="detail-section">
        <div class="detail-section-heading">
          <div>
            <p class="eyebrow">Titles</p>
            <h2>標題清單</h2>
          </div>
        </div>
        <div class="nlma-title-list" id="nlmaTitleList"></div>
      </section>
    </main>

    <script src="data/nlma-regulations.js?v=20260602-nlma-regulations"></script>
    <script>
      const escapeHTML = (value = "") =>
        String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");

      const params = new URLSearchParams(window.location.search);
      const categorySlug = params.get("category") || window.NLMA_REGULATIONS.categories[0].slug;
      const category = window.NLMA_REGULATIONS.categories.find((item) => item.slug === categorySlug) || window.NLMA_REGULATIONS.categories[0];
      document.title = `${category.name} | 何中揚建築師事務所`;
      document.querySelector("#categoryTitle").textContent = category.name;
      document.querySelector("#categorySummary").innerHTML = [
        { label: "標題數", value: `${category.count} 筆` },
        { label: "紅字優先", value: `${category.priorityCount} 筆` },
        { label: "排序", value: "紅字優先 / 日期新到舊" },
      ]
        .map((item) => `<article><span>${escapeHTML(item.label)}</span><strong>${escapeHTML(item.value)}</strong></article>`)
        .join("");

      document.querySelector("#nlmaTitleList").innerHTML = category.items
        .map(
          (item) => `
            <a class="nlma-title-item ${item.priority ? "is-priority" : ""}" href="nlma-regulation-detail.html?id=${encodeURIComponent(item.id)}">
              <time>${escapeHTML(item.date || "未載明日期")}</time>
              <div>
                <strong>${escapeHTML(item.title)}</strong>
                <span>${escapeHTML(item.unit || "未載明業務單位")}</span>
              </div>
              ${item.priority ? '<em>紅字優先</em>' : ""}
            </a>
          `,
        )
        .join("");
    </script>
  </body>
</html>
