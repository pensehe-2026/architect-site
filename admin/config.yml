backend:
  name: git-gateway
  branch: main

local_backend: true
publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "assets/uploads"

site_url: "https://bauhaus.com.tw"
display_url: "https://bauhaus.com.tw"
logo_url: "/assets/ho-chung-yang-hero.png"
locale: "zh_Hant"

collections:
  - name: "building_practice"
    label: "建管實務"
    editor:
      preview: false
    files:
      - name: "building_practice_data"
        label: "建管實務資料"
        file: "data/building-practice.json"
        format: "json"
        fields:
          - { label: "頁面標題", name: "title", widget: "string" }
          - { label: "資料來源", name: "source", widget: "string" }
          - { label: "來源網址", name: "sourceUrl", widget: "string", required: false }
          - { label: "更新時間", name: "updatedAt", widget: "datetime", required: false }
          - label: "分類"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "代碼", name: "slug", widget: "string" }
              - { label: "名稱", name: "name", widget: "string" }
              - { label: "數量", name: "count", widget: "number", value_type: "int", default: 0 }
          - label: "文章"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "縣市", name: "city", widget: "string", default: "臺中市" }
              - { label: "分類", name: "category", widget: "string", default: "作業流程" }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "摘要", name: "summary", widget: "text" }
              - { label: "來源網址", name: "sourceUrl", widget: "string", required: false }
              - { label: "文章縮圖", name: "thumbnail", widget: "image", required: false }
              - label: "下載檔案"
                name: "files"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "縣市", name: "city", widget: "string", default: "臺中市" }
                  - { label: "分類", name: "category", widget: "string", default: "作業流程" }
                  - { label: "標題", name: "title", widget: "string" }
                  - { label: "檔名", name: "fileName", widget: "string", required: false }
                  - { label: "檔案大小", name: "size", widget: "string", required: false }
                  - { label: "官方網址", name: "officialUrl", widget: "string", required: false }
                  - { label: "本機檔案", name: "localFile", widget: "file", media_folder: "/assets/regulations/building-practice/taichung", required: false }
                  - { label: "縮圖", name: "thumbnail", widget: "image", required: false }

  - name: "site_settings"
    label: "網站主內容"
    editor:
      preview: false
    files:
      - name: "site_content"
        label: "首頁與聯絡資訊"
        file: "data/site-content.json"
        format: "json"
        fields:
          - { label: "事務所名稱", name: "studioName", widget: "string" }
          - { label: "英文名稱", name: "studioTagline", widget: "string" }
          - { label: "首頁小標", name: "heroEyebrow", widget: "string" }
          - { label: "首頁大標", name: "heroTitle", widget: "text" }
          - { label: "首頁說明", name: "heroText", widget: "text" }
          - { label: "簡介標題", name: "introTitle", widget: "text" }
          - { label: "事務所簡介", name: "studioIntro", widget: "text" }
          - { label: "聯絡區標題", name: "contactTitle", widget: "text" }
          - label: "聯絡資訊"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "電話", name: "phone", widget: "string" }
              - { label: "傳真", name: "fax", widget: "string" }
              - { label: "地址", name: "address", widget: "string" }
              - { label: "LINE 主要 QR", name: "lineQrImagePrimary", widget: "image", required: false }
              - { label: "LINE 公安 QR", name: "lineQrImageSecondary", widget: "image", required: false }
